<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="40%" stop-color="#0B111A" />
      <stop offset="80%" stop-color="#0E0D1A" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <!-- Glowing Title Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="35%" stop-color="#0094FF" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Subtitle Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.15" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F7FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Aura Filter -->
    <filter id="aura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F7FF" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseAura {
      0% { opacity: 0.25; transform: scale(0.95); }
      50% { opacity: 0.55; transform: scale(1.05); }
      100% { opacity: 0.25; transform: scale(0.95); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(360px); opacity: 0.3; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 900;
      letter-spacing: 7px;
      text-anchor: middle;
    }
    .hud-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      fill: #00F7FF;
      font-weight: 600;
    }
    .sub-text {
      font-family: 'JetBrains Mono', 'Segoe UI', monospace;
      font-weight: 700;
      letter-spacing: 3.5px;
      font-size: 14px;
      text-anchor: middle;
      fill: #E2E8F0;
    }
  </style>

  <!-- 1. Background Box -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- 2. Cyber Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- 3. Ambient Glow Orbs -->
  <circle cx="350" cy="180" r="140" fill="#00F7FF" opacity="0.12" filter="url(#aura)">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="180" r="150" fill="#8B5CF6" opacity="0.15" filter="url(#aura)">
    <animate attributeName="opacity" values="0.10;0.25;0.10" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="140" r="120" fill="#EC4899" opacity="0.08" filter="url(#aura)">
    <animate attributeName="opacity" values="0.05;0.18;0.05" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- 4. Top & Bottom Neon Boundary Accents -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="url(#laserGrad)" stroke-width="2.5" />
  <line x1="200" y1="358" x2="1000" y2="358" stroke="url(#laserGrad)" stroke-width="2.5" />

  <!-- 5. HUD Corner Target Brackets -->
  <g stroke="#00F7FF" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top Left -->
    <path d="M 28 48 L 28 28 L 48 28" />
    <circle cx="28" cy="28" r="3" fill="#00F7FF" />
    <!-- Top Right -->
    <path d="M 1172 48 L 1172 28 L 1152 28" />
    <circle cx="1172" cy="28" r="3" fill="#00F7FF" />
    <!-- Bottom Left -->
    <path d="M 28 312 L 28 332 L 48 332" />
    <circle cx="28" cy="332" r="3" fill="#00F7FF" />
    <!-- Bottom Right -->
    <path d="M 1172 312 L 1172 332 L 1152 332" />
    <circle cx="1172" cy="332" r="3" fill="#00F7FF" />
  </g>

  <!-- 6. HUD Telemetry Coordinates -->
  <text x="60" y="42" class="hud-text" opacity="0.85">SYS_CORE // V2.8_ACTIVE</text>
  <text x="1140" y="42" class="hud-text" text-anchor="end" opacity="0.85">LOC: 30.64°N 76.82°E [IN]</text>
  <text x="60" y="328" class="hud-text" opacity="0.65" fill="#8B5CF6">DOMAINS: ARCH // AI // COMPILERS</text>
  <text x="1140" y="328" class="hud-text" text-anchor="end" opacity="0.65" fill="#8B5CF6">SECURITY: THREAT_ACTIVE</text>

  <!-- 7. Central Live Status Pill -->
  <g transform="translate(470, 72)">
    <rect width="260" height="28" rx="14" fill="#0D1524" stroke="#00F7FF" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Blinking Online Light -->
    <circle cx="20" cy="14" r="5" fill="#00F7FF" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F7FF" letter-spacing="2">SYSTEMS_ARCHITECT</text>
  </g>

  <!-- 8. Giant Glowing Hero Name -->
  <text x="600" y="185" class="title-text" font-size="58" fill="url(#neonTitle)" filter="url(#neonGlow)">
    ARINDAM BHATTACHARYA
  </text>
  <text x="600" y="185" class="title-text" font-size="58" fill="#FFFFFF" opacity="0.95">
    ARINDAM BHATTACHARYA
  </text>

  <!-- 9. Dynamic Tagline Card Bar -->
  <g transform="translate(180, 220)">
    <rect width="840" height="42" rx="21" fill="url(#pillGrad)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <text x="420" y="27" class="sub-text">
      <tspan fill="#00F7FF">AUTONOMOUS AI AGENTS</tspan>
      <tspan fill="#64748B">  |  </tspan>
      <tspan fill="#FFFFFF">COMPILERS &amp; VISUAL IDEs</tspan>
      <tspan fill="#64748B">  |  </tspan>
      <tspan fill="#EC4899">OSS DEFENSE</tspan>
    </text>
  </g>

  <!-- 10. Floating Ambient Micro-Nodes -->
  <circle cx="160" cy="120" r="2" fill="#00F7FF" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="240" cy="270" r="2.5" fill="#8B5CF6" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="110" r="2" fill="#EC4899" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="1040" cy="260" r="3" fill="#00F7FF" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
